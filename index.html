<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Safety First</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./icon.png">
</head>

<body>

<h1 id="applicationTitle">🔥 Safety First</h1>
<h2 id="headline"></h2>

<div id="setup">
  <div>
    <label for="theme-select">Farbschema auswählen:</label>
    <select id="theme-select">
      <option value="dark-blue">Blau</option>
      <option value="dark-teal">Türkis</option>
      <option value="dark-green">Grün</option>
    </select>
  </div>

  <br>

  <input id="playerName" placeholder="Spielername">
  <button id="btnAddPlayer">Spieler hinzufügen</button>

  <div id="players"></div>

  <h3>Fragenset auswählen:</h3>
  <input type="file" id="jsonUpload">

  <h3>Ggf. Medien auswählen:</h3>
  <input type="file" id="fileInput" multiple accept="image/*,video/*">
  <div id="preview"></div>

  <br><br>
  <button class="question-btn" id="btnStartGame">Spiel starten</button>
</div>

<div id="currentPlayer"></div>

<div id="board"></div>

<div id="modal">
  <div id="modal-content">
    <div id="questionPlayer"></div>
    <p id="timer"></p>
    <h2 id="questionText"></h2>
    <div id="media"></div>

    <div id="answer"></div>

    <br>

    <button id="btnRightAnswer">Richtig beantwortet</button>
    <button id="btnWrongAnswer">Falsch beantwortet</button>
    <button id="btnEndQuestion">Frage beenden</button>
  </div>
</div>

<div id="board-buttons">
  <button id="btnShowLeaderboard" style="display: none;">Leaderboard anzeigen</button>
  <button id="btnClearState" style="display: none;">Neues Spiel starten</button>
</div>

<div id="leaderboard">
  <div id="leaderboard-content">
    <div id="leaderboard-list"></div>
  </div>
</div>

<div id="dialog-root"></div>

<script src="app.js" type="module"></script>
</body>
</html>
