<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Safety First</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="./icon.png">
</head>

<body>

<h1 id="applicationTitle">🔥 Safety First</h1>
<h2 id="headline"></h2>

<br>

<div id="currentPlayer"></div>

<br>

<div>
  <label for="theme-select">Farbschema ändern:</label>
  <select id="theme-select">
    <option value="dark-blue">Blau</option>
    <option value="dark-teal">Türkis</option>
    <option value="dark-green">Grün</option>
    <option value="contrast-teal">Kontrastreich</option>
  </select>
</div>

<br>

<div id="setup">

  <input id="playerName" placeholder="Spielername">
  <button id="btnAddPlayer">Spieler hinzufügen</button>

  <br>

  <div id="players"></div>

  <br>

  <div>
    <label for="jsonUpload" class="fileInputLabel">📁 Fragenset auswählen</label>
    <input type="file" id="jsonUpload" accept="application/json" hidden>
    <br><br>
    <div id="jsonFile"></div>
  </div>

  <br>

  <div>
    <label for="mediaFileInput" class="fileInputLabel">📁 Ggf. Medien auswählen</label>
    <input type="file" id="mediaFileInput" multiple accept="image/*,video/*" hidden>
    <br><br>
    <div id="mediaFiles"></div>
  </div>

  <br>
  <button class="question-btn" id="btnStartGame">Spiel starten</button>
</div>

<div id="board"></div>

<div id="modal">
  <div id="modal-content">
    <div id="questionPlayer"></div>
    <p id="timer"></p>
    <h2 id="questionText"></h2>
    <div id="media"></div>

    <div id="answer"></div>

    <br>

    <button id="btnRightAnswer">Richtig beantwortet</button>
    <button id="btnWrongAnswer">Falsch beantwortet</button>
    <button id="btnEndQuestion">Frage beenden</button>
  </div>
</div>

<div id="board-buttons">
  <button id="btnShowLeaderboard" style="display: none;">Leaderboard anzeigen</button>
  <button id="btnClearState" style="display: none;">Neues Spiel starten</button>
</div>

<div id="leaderboard">
  <div id="leaderboard-content">
    <div id="leaderboard-list"></div>
  </div>
</div>

<div id="dialog-root"></div>

<script src="app.js" type="module"></script>
</body>
</html>
